services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volix
      POSTGRES_USER: volix
      POSTGRES_PASSWORD: volix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U volix -d volix']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - '8000:8000'
    environment: &ambiente
      DJANGO_ENV: dev
      DEBUG: 'false'
      SECRET_KEY: troque-esta-chave-em-producao
      ALLOWED_HOSTS: '*'
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: volix
      POSTGRES_USER: volix
      POSTGRES_PASSWORD: volix
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ['celery', '-A', 'core', 'worker', '--loglevel=INFO']
    environment: *ambiente
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata: